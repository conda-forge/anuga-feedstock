{% set version = "4.0.0" %}

package:
  name: anuga
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/anuga/anuga-{{ version }}.tar.gz
  sha256: c92d2a72fbdff7fb4d697f5f29625f2b9749f73caf7280cddc1cb2adb1fe9ac2

build:
  script: {{ PYTHON }} -m pip install . --no-build-isolation -vv
  number: 1

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}

  host:
    - python
    - pip
    - cython
    - meson-python
    - ninja
    - numpy
    - pybind11
    - distutils-activate-mingw  # [win]

  run:
    - python
    - {{ pin_compatible('numpy') }}
    - utm
    - pymetis >=2023.1
    - pyproj >=3.6
    - dill >=0.3.7
    - matplotlib-base >=3.7
    - meshpy >=2022.1
    - netcdf4 >=1.6
    - scipy >=1.11
    - xarray
    - libgomp  # [linux]

  run_constrained:
    - mpi4py
    - affine >=2.4
    - rasterio
    - fiona
    - shapely
    - pandas
    - openpyxl
    - contextily >=1.3
    - pillow >=9.0

test:
  imports:
    - anuga
  commands:
    - pytest --pyargs anuga -x -q -m "not slow" -p no:warnings
  requires:
    - pytest
    - xorg-libx11  # [linux]

about:
  home: https://github.com/anuga-community/anuga_core
  summary: A set of python modules for tsunami and flood modelling
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - stoiver
